name: Go

on:
  push:
    branches:
      - master
      - v2
  pull_request:
    branches:
      - master
      - v2

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Update AS data
        run: ./updateASData.sh

      - name: Generate, build and test
        run: make all

      - name: Run output benchmarks
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/run-benchmarks.sh \
            benchmark-results/benchmarks.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: socket-connect-bpf-benchmarks
          path: benchmark-results/benchmarks.txt
          if-no-files-found: error
          retention-days: 14

      - name: Run integration smoke tests
        shell: bash
        run: |
          set -euo pipefail

          IPV4_PORT=18080
          IPV6_PORT=18082

          TABLE_OUTPUT=/tmp/socket-connect-bpf-table.txt
          TABLE_LOG=/tmp/socket-connect-bpf-table.log
          NDJSON_OUTPUT=/tmp/socket-connect-bpf-events.ndjson
          NDJSON_LOG=/tmp/socket-connect-bpf-ndjson.log

          python3 -m http.server "${IPV4_PORT}" \
            --bind 127.0.0.1 \
            >/tmp/socket-connect-bpf-http-ipv4.log 2>&1 &

          ipv4_server_pid=$!

          python3 -m http.server "${IPV6_PORT}" \
            --bind ::1 \
            >/tmp/socket-connect-bpf-http-ipv6.log 2>&1 &

          ipv6_server_pid=$!

          cleanup() {
            kill "${ipv4_server_pid}" 2>/dev/null || true
            kill "${ipv6_server_pid}" 2>/dev/null || true
          }

          trap cleanup EXIT

          make_requests() {
            for attempt in 1 2 3 4 5; do
              curl \
                --ipv4 \
                --noproxy '*' \
                --fail \
                --silent \
                --show-error \
                "http://127.0.0.1:${IPV4_PORT}/" \
                >/dev/null

              curl \
                --ipv6 \
                --noproxy '*' \
                --fail \
                --silent \
                --show-error \
                "http://[::1]:${IPV6_PORT}/" \
                >/dev/null

              sleep 0.2
            done
          }

          require_loss_summary() {
            local log_path="$1"

            if ! grep -Eq \
              'ring-buffer event loss summary: total=[0-9]+' \
              "${log_path}"
            then
              echo "Tracer log did not contain an event-loss summary."
              echo "--- tracer log ---"
              cat "${log_path}"
              exit 1
            fi
          }

          sleep 1

          sudo timeout \
            --preserve-status \
            --signal=INT \
            6s \
            ./bin/amd64/socket-connect-bpf \
            >"${TABLE_OUTPUT}" \
            2>"${TABLE_LOG}" &

          table_tracer_pid=$!

          sleep 2
          make_requests
          wait "${table_tracer_pid}"

          for expected_port in "${IPV4_PORT}" "${IPV6_PORT}"; do
            if ! grep -q "${expected_port}" "${TABLE_OUTPUT}"; then
              echo \
                "Table output did not contain destination port ${expected_port}."
              echo "--- table output ---"
              cat "${TABLE_OUTPUT}"
              echo "--- tracer log ---"
              cat "${TABLE_LOG}"
              exit 1
            fi
          done

          require_loss_summary "${TABLE_LOG}"

          sudo timeout \
            --preserve-status \
            --signal=INT \
            6s \
            ./bin/amd64/socket-connect-bpf \
            --output ndjson \
            >"${NDJSON_OUTPUT}" \
            2>"${NDJSON_LOG}" &

          ndjson_tracer_pid=$!

          sleep 2
          make_requests
          wait "${ndjson_tracer_pid}"

          require_loss_summary "${NDJSON_LOG}"

          python3 - \
            "${NDJSON_OUTPUT}" \
            "${IPV4_PORT}" \
            "${IPV6_PORT}" <<'PY'
          import json
          import pathlib
          import sys

          output_path = pathlib.Path(sys.argv[1])
          ipv4_port = int(sys.argv[2])
          ipv6_port = int(sys.argv[3])

          if not output_path.exists():
              raise SystemExit("NDJSON output file was not created")

          lines = [
              line
              for line in output_path.read_text(
                  encoding="utf-8",
              ).splitlines()
              if line.strip()
          ]

          if not lines:
              raise SystemExit("NDJSON output contained no events")

          events = []

          for line_number, line in enumerate(lines, start=1):
              try:
                  event = json.loads(line)
              except json.JSONDecodeError as error:
                  raise SystemExit(
                      f"invalid JSON on line {line_number}: {error}"
                  ) from error

              if event.get("schema_version") != 1:
                  raise SystemExit(
                      f"unexpected schema version on line {line_number}"
                  )

              if event.get("event_type") != "connect_attempt":
                  raise SystemExit(
                      f"unexpected event type on line {line_number}"
                  )

              events.append(event)

          expected_connections = [
              {
                  "port": ipv4_port,
                  "ip": "127.0.0.1",
                  "address_family": "AF_INET",
              },
              {
                  "port": ipv6_port,
                  "ip": "::1",
                  "address_family": "AF_INET6",
              },
          ]

          for expected in expected_connections:
              matching_events = [
                  event
                  for event in events
                  if (
                      event.get("destination", {}).get("port")
                      == expected["port"]
                      and event.get("destination", {}).get("ip")
                      == expected["ip"]
                      and event.get("address_family")
                      == expected["address_family"]
                      and event.get("process", {}).get("comm")
                      == "curl"
                  )
              ]

              if not matching_events:
                  raise SystemExit(
                      "no matching NDJSON event found for "
                      f"{expected['address_family']} "
                      f"{expected['ip']}:{expected['port']}"
                  )
          PY

      - name: Run kernel filter integration tests
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/test-kernel-filters.sh \
            ./bin/amd64/socket-connect-bpf

      - name: Create release artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p bin/amd64/as
          mkdir -p bin/arm64/as
          mkdir -p artifacts

          for architecture in amd64 arm64; do
            cp README.md "bin/${architecture}/"
            cp LICENSE "bin/${architecture}/"
            cp LICENSING.md "bin/${architecture}/"
            cp THIRD_PARTY_NOTICES.md "bin/${architecture}/"
            cp as/*.tsv "bin/${architecture}/as/"
          done

          tar czf \
            artifacts/socket-connect-bpf-linux-amd64.tar.gz \
            --directory=bin/amd64/ \
            .

          tar czf \
            artifacts/socket-connect-bpf-linux-arm64.tar.gz \
            --directory=bin/arm64/ \
            .

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail

          for architecture in amd64 arm64; do
            archive="artifacts/socket-connect-bpf-linux-${architecture}.tar.gz"
            contents="$(tar tzf "${archive}")"

            for required_file in \
              "./socket-connect-bpf" \
              "./README.md" \
              "./LICENSE" \
              "./LICENSING.md" \
              "./THIRD_PARTY_NOTICES.md" \
              "./as/ip2asn-v4-u32.tsv" \
              "./as/ip2asn-v6.tsv"
            do
              if ! grep -Fxq "${required_file}" <<<"${contents}"; then
                echo "${archive} is missing ${required_file}"
                echo "--- archive contents ---"
                printf '%s\n' "${contents}"
                exit 1
              fi
            done
          done

      - name: Test packaged ASN loading
        shell: bash
        run: |
          set -euo pipefail

          bash scripts/test-packaged-asn-loading.sh \
            artifacts/socket-connect-bpf-linux-amd64.tar.gz \
            18081

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: socket-connect-bpf
          path: artifacts
          if-no-files-found: error
